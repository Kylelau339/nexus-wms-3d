name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Before `npm ci`, because `npm ci` refuses to install when the manifest
      # and the lockfile disagree — and the resulting error points at npm
      # rather than at the version bump that caused it.
      - name: Check the manifest and lockfile agree
        run: npm run check:manifest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit, invariant and multi-seed stress tests
        run: npm test

      - name: i18n dictionary audit
        run: npm run i18n:check

      - name: WCAG 2.1 contrast audit
        run: npm run audit:contrast

      - name: Production build
        run: npx vite build

      - name: Self-containment audit
        run: node scripts/selfcontained-check.mjs

      - name: dist integrity + bundle budget
        run: node scripts/predeploy.mjs --dist-only

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-wms-3d-dist
          path: dist/
          retention-days: 7

  browser:
    name: Browser audits
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the manifest and lockfile agree
        run: npm run check:manifest

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npx vite build

      - name: Serve the build
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              echo "preview server is up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not start"
          exit 1

      - name: Audit every breakpoint
        run: npm run audit:responsive

      - name: Audit the runtime resilience
        run: npm run audit:resilience
